[Paths]
input_file_path = /Users/siddhesh/Downloads/trial-dnoiser
output_file_path = /Users/siddhesh/Downloads/deNoised

[Output]
# Output format: png (lossless), tiff (lossless), jpg (lossy)
format = png
# JPEG quality (1-100, only used if format=jpg)
jpeg_quality = 95
# Preserve original format instead of using format setting (true/false)
preserve_original_format = false
# Preserve color: denoise only luminance, keeping saturation/hue intact (true/false)
preserve_color = true
# Apply sharpening after denoising to restore structure and detail (true/false)
apply_sharpening = false
# Sharpening strength (0.0-2.0, typical: 0.3-1.5, higher = more sharpening)
sharpen_amount = 1.2
# Sharpening radius (0.5-3.0, typical: 1.0-2.0, higher = broader sharpening)
sharpen_radius = 1.5
# Boost saturation to enhance color vibrancy (true/false)
boost_saturation = false
# Saturation boost strength (1.0 = no change, 1.3 = moderate, 1.5-2.0 = strong)
saturation_amount = 1.3
# Boost brightness to lighten image (true/false)
boost_brightness = false
# Brightness boost strength (0.8 = darker, 1.0 = no change, 1.1 = subtle, 1.2-1.5 = strong)
brightness_amount = 1.1

[Filters]
# Enable/disable individual filters (true/false)
enable_gaussian = true
enable_median = true
enable_nonlocal = true

[AIDenoiser]
# Enable AI-based denoising (requires PyTorch - see requirements-ai.txt)
enable_ai = false
# AI model to use: scunet (faster, 3MB) or nafnet (better quality, 9MB)
model_name = scunet
# Device: auto (automatic), cuda (NVIDIA GPU), mps (Apple Silicon), cpu
device = auto

[GaussianFilter]
# Sigma value (0.5-2.0, higher = more smoothing)
sigma = 0.75

[MedianFilter]
# Filter size (3, 5, 7, etc. - must be odd number)
size = 3

[NonLocalMeans]
# h_multiplier (0.6-1.5, higher = more denoising but may lose detail)
# Lower values preserve more detail, higher values remove more noise
h_multiplier = 0.85
# fast_mode (true/false, true is faster but slightly lower quality)
fast_mode = true
# patch_size (3, 5, 7 - size of patches used for comparison)
# Smaller = sharper but less noise reduction, larger = smoother
patch_size = 3
# patch_distance (3-13 - search area for similar patches)
# Larger values = better quality but slower
patch_distance = 3

[RAW]
# RAW processing mode (full, half, preview)
# full: Full resolution processing (slow, best quality)
# half: Half resolution processing (faster, good quality)
# preview: Extract embedded JPEG preview (fastest, lower quality)
processing_mode = half